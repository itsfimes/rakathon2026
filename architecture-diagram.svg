<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 940" width="1660" height="940" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Backend implementation: logical modules B1–B6, storage modes and AI modes</title>
<desc id="d">Drawn from the backend implementation, not architecture.md. B1 to B6 are logical modules inside one Python BackendApp process; each has its own authenticated Unix-socket JSON-RPC endpoint and replies return on the request connection. A CLI client calls B4 over Unix JSON-RPC. An optional dev HTTP facade, in the same process, calls B4 from loopback with a shared proxy key mapped to a fixed viewer or web-assistant role; it is dev only and has no user login. B4 sends ingest to B1, storage calls (FHIR, tasks, vector, screening) to B2, and ai.complete to B5. B1 turns DOCX or text into validated FHIR; there is no OCR or PDF support (PDF goes to manual review). B1 calls B5 with ai.translate and returns its result; it does not write to B2. Only the CLI performs a separate B4 to B2 write, in mock mode only. B1 and B5 share an in-memory BlobStore through bytesRef. B1 to B5 all authorize through B6, a packaged mock permission matrix. B3 polls B2 tasks and delivers reminders to B4, which keeps them in memory with no frontend push; B3 is off in iris-fhir mode. Storage modes are alternatives, only one active: mock (default) uses ephemeral MemoryStorage; iris-fhir (opt-in) uses a direct FHIR adapter to InterSystems IRIS FHIR REST over verified HTTPS, live verified for create, read and update, with tasks and vectors unavailable; bridge (optional) uses an encrypted Fernet client to a separate bridge process with composite storage: FHIR REST over local loopback plus native IRIS DBAPI for task SQL with ACK, an anonymized or synthetic vector store, a restricted patient vector store whose refs are hydrated through FHIR with auth, and screening SQL (a separate screening dataset, not FHIR). The bridge path, SQL, vector, tasks and screening are implemented but not verified live. InterSystems nodes are logical capabilities, not separate servers. FHIR SQL Builder is not used. An optional local screening CSV archive mount exists and is not drawn. AI modes are alternatives: mock (default, local, no egress), direct HTTP to a remote AI over HTTPS (opt-in), or a local OpenCode child process reaching a provider over HTTPS (opt-in). B5 handles permission, egress gating and the kill switch. Outbound HTTPS exists for both AI and IRIS FHIR. No external health endpoints or production auth are claimed.</desc>
