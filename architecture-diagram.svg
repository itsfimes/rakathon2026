<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1980 900" width="1980" height="900" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Current architecture: browser, HTTP container with modules B2, B4, B6, B7, per-job converter, Azure AI and InterSystems IRIS</title>
<desc id="d">A React app in the browser (clinical workspace, login, uploads, human review; roles koordinator, lekar, mdt, pacient) calls the auth-serve HTTP edge over HTTPS with a session cookie. The edge runs on loopback port 18765 inside the Docker container rakathon-http, one Python process that also holds the logical modules, each on its own Unix-socket JSON-RPC endpoint, and an UploadWorker thread. The edge checks sessions, CSRF and origin and sends login, resolve and logout to B7 Auth, which keeps accounts, sessions and keys in an auth SQLite file on a host mount. The edge calls B4 Router as web:auth with the verified user. B4 sends FHIR read and search and document.approve to B2 Storage, which uses the FhirOnly adapter to reach InterSystems IRIS FHIR R4 over HTTPS (create, read and update verified live). Writes only happen after human approval. B6 Access applies a role and action policy with roles from the auth store and authorizes the modules and the edge. Upload routes read and write an encrypted upload store on a host mount (AES-GCM originals, results, transcriptions, review receipts). On upload, the UploadWorker uses a Docker launcher and the mounted Docker socket to start a fresh read-only converter container per job (input read-only, output read-write, secret read-only). The converter holds parsers and Poppler (DOCX, TXT, JSON, CSV, text-layer PDF up to 20 pages, scans up to 2 pages) and an AI engine that calls Azure AI (gpt-6-luna-dz-eu) over HTTPS in two turns: transcription, then a FHIR draft. Outputs are review candidates; the worker collects them into the upload store. B2 also connects to an InterSystems IRIS Vector store for vector search.</desc>
