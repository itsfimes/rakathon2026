[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rakathon-backend"
version = "0.1.0"
description = "Rakathon 2026 backend foundation (offline IPC, contracts, B6 mock policy)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=44",
    "httpx>=0.28,<0.29",
    "fhir.resources==6.4.0",
    "pydantic[email]>=1.10.26,<2",
    "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
iris = ["intersystems-irispython"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=1",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
rakathon-backend = "rakathon_backend.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rakathon_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/rakathon_backend/common/ipc.py" = ["BLE001"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["iris.*", "jsonschema.*"]
ignore_missing_imports = true
